<script>

/* =========================================================
   TELEGRAM + META SUBSCRIBE TRACKING

   - One CTA handler
   - Subscribe only on intentional CTA click
   - Duplicate/rapid clicks blocked
   - Telegram redirect preserved
   ========================================================= */


(function(){

    const TELEGRAM_LINK =
        "https://t.me/+2Mwqp-pUmiljODc1";

    const telegramBtn =
        document.getElementById("telegramBtn");


    /* Prevent duplicate click processing */
    let clickLocked = false;


    /* Global state used by auto redirect */
    window.__telegramClicked = false;


    /* Create a unique browser-side event ID */
    function createEventId(){

        return "tg_subscribe_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,10);

    }


    /* Track Subscribe */
    function trackSubscribe(){

        if(typeof window.fbq !== "function"){

            console.warn(
                "Meta Pixel is not available."
            );

            return;

        }


        const eventId =
            createEventId();


        fbq(
            "track",
            "Subscribe",
            {
                content_name:
                    "Stock Learner - Gautam Jhaa",

                content_category:
                    "Telegram Community",

                button_location:
                    "main_cta"
            },
            {
                eventID:
                    eventId
            }
        );


        console.log(
            "Subscribe event sent:",
            eventId
        );

    }


    /* CTA click */
    if(telegramBtn){

        telegramBtn.addEventListener(
            "click",
            function(event){

                /*
                   If already clicked,
                   block additional events.
                */
                if(clickLocked){

                    event.preventDefault();

                    return;

                }


                clickLocked = true;

                window.__telegramClicked = true;


                /*
                   Prevent normal navigation temporarily
                   so Pixel request has time to start.
                */
                event.preventDefault();


                telegramBtn.classList.add(
                    "processing"
                );


                /* Send ONE Subscribe event */
                trackSubscribe();


                /*
                   Short delay for browser to dispatch
                   the tracking request.
                */
                setTimeout(function(){

                    window.location.href =
                        TELEGRAM_LINK;

                }, 500);

            },
            {
                passive:false
            }
        );

    }

})();

</script>
