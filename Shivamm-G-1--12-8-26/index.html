<script>

/* =========================================================
   TELEGRAM + META TRACKING
   =========================================================

   Pixel:
   2175580793303485

   Telegram:
   https://t.me/+2Mwqp-pUmiljODc1

   Important:
   - No automatic redirect
   - No Lead event
   - One Subscribe event per CTA interaction
   - Double-click protection
   ========================================================= */


/* TELEGRAM URL */

const TELEGRAM_LINK =
    "https://t.me/+2Mwqp-pUmiljODc1";


/* CTA */

const telegramBtn =
    document.getElementById("telegramBtn");


/* CLICK LOCK */

let clickLocked = false;


/* CREATE UNIQUE EVENT ID */

function createEventId(){

    return (
        "tg_subscribe_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,10)
    );

}


/* =========================================================
   TRACK SUBSCRIBE
   ========================================================= */

function trackSubscribe(){

    if(typeof window.fbq !== "function"){

        console.warn(
            "Meta Pixel is not available."
        );

        return;

    }


    const eventId =
        createEventId();


    fbq(
        "track",
        "Subscribe",
        {
            content_name:
                "Gautam Jhaa Telegram Community",

            content_category:
                "Telegram",

            button_location:
                "main_cta"
        },
        {
            eventID:
                eventId
        }
    );


    console.log(
        "Subscribe event sent:",
        eventId
    );

}


/* =========================================================
   TELEGRAM BUTTON
   ========================================================= */

if(telegramBtn){

    telegramBtn.addEventListener(
        "click",
        function(event){

            /*
             * Prevent duplicate clicks.
             */

            if(clickLocked){

                event.preventDefault();

                return;

            }


            clickLocked = true;


            /*
             * Stop normal anchor navigation
             * temporarily so Pixel request gets
             * a moment to leave the browser.
             */

            event.preventDefault();


            telegramBtn.classList.add(
                "processing"
            );


            /*
             * Fire ONE Subscribe event.
             */

            trackSubscribe();


            /*
             * Navigate to Telegram after
             * a short delay.
             */

            setTimeout(
                function(){

                    window.location.href =
                        TELEGRAM_LINK;

                },
                500
            );

        },
        {
            passive:false
        }
    );

}

</script>
