<style>

*{

    padding:0;
    box-sizing:border-box;

html,
body{

body{

    min-height:100vh;

/* =====================================================

.main{

    width:100%;

/* =====================================================
   CARD
   ===================================================== */

.card{

    width:100%;

    padding:40px 30px;

    border-radius:20px;

    background:
        rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    border:
        1px solid
        rgba(255,255,255,.15);

    box-shadow:
        0 0 80px
        rgba(0,0,0,.6);

}


/* =====================================================
   PROFILE
   ===================================================== */

.profile{

    width:110px;
    height:110px;

    border-radius:50%;

    border:4px solid white;

    object-fit:cover;

    margin-bottom:15px;

    display:block;

    margin-left:auto;
    margin-right:auto;

}


/* =====================================================
   HEADING
   ===================================================== */

h2{

    margin-bottom:10px;

    font-size:21px;

    line-height:1.3;

}


/* =====================================================
   DESCRIPTION
   ===================================================== */

.text{

    font-size:14px;

    line-height:1.6;

    opacity:.9;

    margin-bottom:25px;

}


/* =====================================================
   TELEGRAM BUTTON
   ===================================================== */

.btn{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    width:100%;

    padding:15px 20px;

    border-radius:50px;

    background:
        linear-gradient(
            45deg,
            #6366f1,
            #06b6d4
        );

    color:white;

    text-decoration:none;

    font-weight:bold;

    font-size:16px;

    position:relative;

    transition:
        transform .2s ease,
        opacity .2s ease,
        box-shadow .2s ease;

    overflow:hidden;

    cursor:pointer;

    border:none;

}


.btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 30px
        rgba(6,182,212,.55);

}


.btn:active{

    transform:scale(.97);

}


.btn.processing{

    opacity:.6;

    pointer-events:none;

}


.btn i{

    font-size:18px;

}


/* =====================================================
   SPARKLES
   ===================================================== */

.btn span{

    position:absolute;

    width:6px;
    height:6px;

    background:white;

    border-radius:50%;

    animation:
        spark 3s infinite;

    pointer-events:none;

}


.btn span:nth-child(1){

    top:-10px;
    left:20%;

}


.btn span:nth-child(2){

    top:-10px;
    left:50%;

    animation-delay:1s;

}


.btn span:nth-child(3){

    top:-10px;
    left:80%;

    animation-delay:2s;

}


@keyframes spark{

    0%{

        transform:
            translateY(0);

        opacity:1;

    }

    100%{

        transform:
            translateY(-40px);

        opacity:0;

    }

}


/* =====================================================
   STATUS
   ===================================================== */

.status{

    margin-top:12px;

    font-size:12px;

    opacity:.65;

}


/* =====================================================
   DISCLAIMER
   ===================================================== */

<!-- =====================================================
     TELEGRAM + META SUBSCRIBE TRACKING

     RULES:

     1. Subscribe fires ONLY on real CTA click
     2. No Subscribe on page load
     3. No Subscribe on automatic redirect
     4. Duplicate clicks are blocked
     5. Only one Pixel is initialized
     6. Only one PageView is fired
     ===================================================== -->

<script>

(function(){

    "use strict";


    /* =================================================
       CONFIG
       ================================================= */

    const TELEGRAM_LINK =
        "https://t.me/+nmUqPpSOgWY0OWI1";


    const telegramBtn =
        document.getElementById("telegramBtn");


    let clickLocked = false;


    /* =================================================
       EVENT ID
       ================================================= */

    function createEventId(){

        return (
            "telegram_subscribe_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,10)
        );

    }


    /* =================================================
       BUTTON CHECK
       ================================================= */

    if(!telegramBtn){

        return;

    }


    /* =================================================
       REAL USER CLICK ONLY
       ================================================= */

    telegramBtn.addEventListener(
        "click",
        function(event){

            /*
             * Stop normal navigation temporarily.
             */

            event.preventDefault();


            /*
             * Prevent rapid/double clicks.
             */

            if(clickLocked){

                return;

            }


            clickLocked = true;


            /*
             * Disable button visually.
             */

            telegramBtn.classList.add(
                "processing"
            );


            /* =========================================
               META SUBSCRIBE EVENT

               Fires ONLY after actual CTA click.
               ========================================= */

            if(
                typeof window.fbq === "function"
            ){

                const eventId =
                    createEventId();


                window.fbq(
                    "track",
                    "Subscribe",
                    {

                        content_name:
                            "Telegram Community",

                        content_category:
                            "Telegram",

                        button_location:
                            "main_cta"

                    },
                    {

                        eventID:
                            eventId

                    }
                );

            }


            /*
             * Short delay gives the browser time
             * to initiate the Meta request.
             *
             * Then Telegram opens.
             */

            setTimeout(
                function(){

                    window.location.href =
                        TELEGRAM_LINK;

                },
                700
            );


        },
        {
            passive:false
        }
    );


})();

</script>
