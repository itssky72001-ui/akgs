.btn:hover{

/* SPARKLE */

.btn span{

}

.btn span:nth-child(2){

}

.btn span:nth-child(3){
top:-10px;
left:80%;

}

@keyframes spark{

0%{
transform:translateY(0);
opacity:1
}

100%{

<script>

/* =====================================================
   TELEGRAM + META PIXEL TRACKING
   ===================================================== */


/* Single Telegram destination */
const TELEGRAM_LINK =
"https://t.me/+inHjdDwWKagzZGNl";


const telegramBtn =
document.getElementById("telegramBtn");


const counter =
document.getElementById("count");


/*
   Prevent duplicate/double Subscribe events
*/
let clickLocked = false;


/*
   Generate unique Event ID
*/
function createEventId(){

    return "telegram_subscribe_" +
           Date.now() +
           "_" +
           Math.random()
           .toString(36)
           .substring(2,10);

}


/*
   Track intentional CTA click only
*/
function trackSubscribe(){

    if(typeof window.fbq !== "function"){
        console.warn("Meta Pixel is not available.");
        return;
    }


    const eventId = createEventId();


    fbq(
        "track",
        "Subscribe",
        {
            content_name:
            "Pankaj Bhardwaj Telegram Community",

            content_category:
            "Telegram",

            button_location:
            "telegram_cta"
        },
        {
            eventID:eventId
        }
    );


    console.log(
        "Subscribe event sent:",
        eventId
    );

}


/*
   CTA CLICK
*/
if(telegramBtn){

    telegramBtn.addEventListener(
        "click",
        function(event){

            /*
               Stop duplicate clicks
            */
            if(clickLocked){

                event.preventDefault();

                return;

            }


            clickLocked = true;


            /*
               Prevent browser from navigating
               immediately so Pixel request gets
               a moment to leave the page.
            */
            event.preventDefault();


            telegramBtn.style.opacity = "0.65";
            telegramBtn.style.pointerEvents = "none";


            /*
               Subscribe is fired ONLY because
               the user intentionally clicked CTA.
            */
            trackSubscribe();


            /*
               Small delay for Pixel request
            */
            setTimeout(function(){

                window.location.href =
                TELEGRAM_LINK;

            },500);


        },
        {
            passive:false
        }
    );

}


/* =====================================================
   AUTO REDIRECT
   IMPORTANT:
   Auto redirect does NOT fire Subscribe.
   ===================================================== */

let time = 30;


const countdown =
setInterval(function(){

    time--;

    if(counter){
        counter.innerText = time;
    }


    if(time <= 0){

        clearInterval(countdown);


        /*
           Automatic navigation only.
           No Subscribe event here.
        */
        window.location.href =
        TELEGRAM_LINK;

    }

},1000);

</script>
